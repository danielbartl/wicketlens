<!DOCTYPE html>
<html xmlns:wicket="http://wicket.apache.org">
<body>
    <h1 wicket:id="title">Standard controls</h1>
    <div wicket:id="feedback"></div>
    <form wicket:id="form">
        <div>
            <input wicket:id="enabled" type="checkbox"/>
            <select wicket:id="choice"><option>One</option></select>
        </div>
        <button wicket:id="save" type="submit">Save</button>
        <a wicket:id="submitLink">Submit</a>
        <button wicket:id="ajaxSave" type="submit">Save with Ajax</button>
    </form>
    <a wicket:id="bookmark">Customers</a>
    <a wicket:id="external">Wicket</a>
    <a wicket:id="link">Server link</a>
    <a wicket:id="ajaxLink">Ajax link</a>
</body>
</html>
